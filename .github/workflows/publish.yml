name: Publish

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - src/**
      - test/**
      - tsup.config.ts
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-package-root-meta
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package-root-meta and create GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail

          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"

          test "$NAME" = "package-root-meta"

          npm run build
          npm run typecheck
          npm test
          npm pack --dry-run

          echo "name=$NAME" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_ENV"

      - name: Bump patch if version already exists
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"

          if npm view "$name@$VERSION" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            TAG="v$VERSION"

            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              npm version patch --no-git-tag-version

              NEW_VERSION="$(node -p "require('./package.json').version")"

              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add package.json
              git commit -m "chore(release): bump $name to $NEW_VERSION"
              git push origin HEAD:main

              VERSION="$NEW_VERSION"
            else
              echo "$name@$VERSION is already published but its release tag is missing; recovering the existing release."
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish with npm trusted publishing
        shell: bash
        run: |
          set -euo pipefail

          # npm Trusted Publishing can grant either direct publishing or staged publishing.
          # Use direct publishing when the trust relationship allows it; otherwise stage safely.
          set +e
          OUTPUT="$(npm publish --access public 2>&1)"
          STATUS=$?
          set -e

          printf '%s\n' "$OUTPUT"

          if [[ "$STATUS" -eq 0 ]]; then
            echo "publish_mode=direct" >> "$GITHUB_ENV"
            exit 0
          fi

          if printf '%s\n' "$OUTPUT" | grep -q "OIDC permission denied for this action"; then
            echo "Direct npm publish is not permitted by the configured trusted publisher."
            echo "Falling back to npm staged publishing."
            npm stage publish
            echo "publish_mode=staged" >> "$GITHUB_ENV"
            exit 0
          fi

          exit "$STATUS"

      - name: Report staged release
        if: env.publish_mode == 'staged'
        shell: bash
        run: |
          echo "Package was accepted by npm as a staged publish."
          echo "GitHub release/tag creation is intentionally skipped until the staged package is approved on npm."

      - name: Create release tag
        if: env.publish_mode == 'direct'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          RELEASE_SHA="$(git rev-parse origin/main)"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git tag -a "$TAG" "$RELEASE_SHA" -m "$TAG"
            git push origin "$TAG"
          fi

          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_ENV"

      - name: Create GitHub release
        if: env.publish_mode == 'direct'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ env.release_sha }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG"               --repo "$GITHUB_REPOSITORY"               --target "$RELEASE_SHA"               --title "$TAG"               --generate-notes
          fi
