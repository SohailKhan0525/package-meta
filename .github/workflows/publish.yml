name: Publish

on:
  push:
    branches: [main]
    paths:
      - package.json
      - src/**
      - test/**
      - tsup.config.ts
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-package-root-meta
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish package-root-meta
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').name")" = "package-root-meta"
          npm run build
          npm run typecheck
          npm test
          npm pack --dry-run

      - name: Resolve release state
        id: state
        shell: bash
        run: |
          set -euo pipefail

          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if npm view "$NAME@$VERSION" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "state=published_tagged" >> "$GITHUB_OUTPUT"
            else
              echo "state=published_untagged" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "state=unpublished" >> "$GITHUB_OUTPUT"
          fi

      - name: Recover GitHub release for already-published version
        if: steps.state.outputs.state == 'published_untagged'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.state.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          SHA="$(git rev-parse origin/main)"

          git tag -a "$TAG" "$SHA" -m "$TAG"
          git push origin "$TAG"

          gh release create "$TAG"             --repo "$GITHUB_REPOSITORY"             --target "$SHA"             --title "$TAG"             --generate-notes

      - name: Bump patch for next release
        if: steps.state.outputs.state == 'published_tagged'
        shell: bash
        run: |
          set -euo pipefail

          npm version patch --no-git-tag-version

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): bump package-root-meta"
          git push origin HEAD:main

      - name: Stage unpublished version
        if: steps.state.outputs.state == 'unpublished'
        shell: bash
        run: |
          set -euo pipefail

          set +e
          OUTPUT="$(npm stage publish 2>&1)"
          STATUS=$?
          set -e

          printf '%s\n' "$OUTPUT"

          if [[ "$STATUS" -eq 0 ]]; then
            echo "package-root-meta@$(node -p "require('./package.json').version") has been staged on npm."
            echo "Approve the staged package on npm to make it public."
            exit 0
          fi

          if printf '%s\n' "$OUTPUT" | grep -Eqi 'previously staged|already staged|409 Conflict'; then
            echo "This version is already staged on npm and is waiting for approval."
            exit 0
          fi

          exit "$STATUS"
