name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: publish-package-root-meta
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package-root-meta and create GitHub release
    if: >-
      (
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):')
        )
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail

          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"

          test "$NAME" = "package-root-meta" || {
            echo "Unexpected package name: $NAME"
            exit 1
          }

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            TAG="$GITHUB_REF_NAME"
            TAG_VERSION="${TAG#v}"

            test "$VERSION" = "$TAG_VERSION" || {
              echo "package.json version ($VERSION) does not match tag ($TAG)"
              exit 1
            }
          fi

          npm run typecheck
          npm test
          npm pack --dry-run

      - name: Bump version if already published
        id: version
        shell: bash
        run: |
          set -euo pipefail

          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"

          if npm view "$NAME@$VERSION" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published; bumping patch version."
            npm version patch --no-git-tag-version
            NEW_VERSION="$(node -p "require('./package.json').version")"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json
            git commit -m "chore(release): bump $NAME to $NEW_VERSION"
            git push origin HEAD:main

            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$VERSION is not published; using the current version."
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        shell: bash
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_SECRET }}

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_SHA="${{ steps.version.outputs.release_sha }}"

          if [[ "$GITHUB_EVENT_NAME" == "push" && "${GITHUB_REF_TYPE:-}" == "tag" && "$VERSION" == "${GITHUB_REF_NAME#v}" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$VERSION"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Point release tag at validated commit
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
            if [[ "$CURRENT_SHA" != "$RELEASE_SHA" ]]; then
              gh api --method PATCH                 "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG"                 -f sha="$RELEASE_SHA"                 -F force=true
            fi
          else
            gh api --method POST               "repos/$GITHUB_REPOSITORY/git/refs"               -f ref="refs/tags/$TAG"               -f sha="$RELEASE_SHA"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists."
            exit 0
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "$TAG" \
            --generate-notes
